 
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to publish (for example: v0.1.0 or main-<sha>)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]] && ! git rev-parse -q --verify "refs/tags/v$(cat VERSION)" >/dev/null; then
            # First main push of a new VERSION: publish it as the stable
            # release, which setup.sh and self-update fetch via releases/latest.
            tag="v$(cat VERSION)"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            tag="v$(cat VERSION)-main-$(git rev-parse --short HEAD)"
          else
            echo "Unsupported ref: ${GITHUB_REF}"
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

          if [[ "${tag}" == *"-main-"* ]]; then
            echo "release_name=gnosh main $(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_name=gnosh $(cat VERSION)" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cross compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-riscv64-linux-gnu

      - name: Check version
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [[ "${TAG}" == v* && "${TAG}" != *"-main-"* ]]; then
            test "v${VERSION}" = "${TAG}" || { echo "VERSION (${VERSION}) does not match tag ${TAG}"; exit 1; }
          fi

      - name: Build release archive
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          make dist
          cp "build/gnosh-${VERSION}.tar.gz" build/gnosh.tar.gz
          (cd build && sha256sum gnosh.tar.gz > gnosh.tar.gz.sha256)
          cp setup.sh build/setup.sh
          tools/release-notes.py "$VERSION" > build/notes.md

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --yes --cleanup-tag=false
          fi

          extra_args=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            extra_args+=(--prerelease --latest=false)
          else
            extra_args+=(--latest)
          fi

          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_NAME}" \
            --notes-file build/notes.md \
            "${extra_args[@]}" \
            "build/gnosh-${VERSION}.tar.gz" \
            "build/gnosh-${VERSION}.tar.gz.sha256" \
            "build/gnosh.tar.gz" \
            "build/gnosh.tar.gz.sha256" \
            "build/setup.sh"
