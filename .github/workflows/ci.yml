name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck gjs gir1.2-gtk-3.0 python3
      - name: shellcheck
        run: |
          shellcheck -s sh setup.sh tests/integration/run-nested.sh tests/integration/run-phosh.sh tests/integration/test-setup.sh tests/integration/matrix.sh tests/integration/steps/*.sh tests/device/*.sh tools/*.sh
          shellcheck -s bash tests/integration/container-run.sh
      - name: Python syntax
        run: python3 -m py_compile bin/gnosh
      - name: JS syntax
        run: tools/check-js-syntax.sh
      - name: Data files
        run: |
          python3 -m json.tool runtime/data/compat.json >/dev/null
          python3 -m json.tool tests/results/extensions.json >/dev/null
      - name: Prebuilt modules match the source
        run: make check-prebuilt
      - name: Unit tests (GJS)
        run: gjs -m tests/unit/run.js
      - name: Unit tests (Python)
        run: python3 -m unittest discover -s tests/unit -p 'test_*.py' -v

  modules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cross compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-riscv64-linux-gnu
      - name: Build modules for all architectures
        run: make modules
      - name: Modules have no link-time dependencies
        run: |
          for f in build/libgnosh-phosh-*.so; do
            if readelf -d "$f" | grep -q NEEDED; then echo "$f has NEEDED entries"; exit 1; fi
            readelf --dyn-syms "$f" | grep -q gtk_module_init || { echo "$f lacks gtk_module_init"; exit 1; }
          done

  phosh-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the Phosh test image (postmarketOS edge)
        run: podman build -t gnosh-test-pmos -f tests/container/Containerfile.pmos tests/container
      - name: Build the module
        run: make module
      - name: Official extensions in headless Phosh
        run: |
          EXTENSIONS="places-menu@gnome-shell-extensions.gcampax.github.com system-monitor@gnome-shell-extensions.gcampax.github.com drive-menu@gnome-shell-extensions.gcampax.github.com" \
            tests/integration/run-nested.sh "$PWD/out/official" tests/integration/steps/official.sh
          tests/integration/check-status.py out/official/status.txt --active places-menu@gnome-shell-extensions.gcampax.github.com system-monitor@gnome-shell-extensions.gcampax.github.com
      - name: setup.sh as a new user, then gnosh install from extensions.gnome.org
        run: |
          tests/integration/container-run.sh tests/integration/test-setup.sh "$PWD/out/setup" SETUP_SOURCE=git \
            "INSTALL=caffeine@patapon.info clipboard-indicator@tudmotu.com Vitals@CoreCoding.com"
          tests/integration/check-status.py out/setup/status.txt --active caffeine@patapon.info clipboard-indicator@tudmotu.com Vitals@CoreCoding.com
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phosh-integration
          path: out/
